[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zkit-lib"
dynamic = ["version"]
description = "Post-processing toolkit for TDSEZ simulation outputs"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Zakaria Dahbi", email = "zdahbi@outlook.es" },
]
keywords = [
    "b-spline",
    "hdf5",
    "iga",
    "quantum",
    "schrodinger",
    "spectroscopy",
    "tdsez",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "h5py>=3.8",
    "numpy>=1.23",
]

[project.optional-dependencies]
physics = ["sympy>=1.11"]
reconstruction = ["igakit>=0.1"]
viz = ["matplotlib>=3.7"]
vtk = [
    "igakit>=0.1",
    "pyvista>=0.43",
]
mwigner = [
    "matplotlib>=3.7",
    "torch>=2.0",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
]
test = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
zkit = "zkit.cli:main"

[project.urls]
Documentation = "https://dahbiz.github.io/zkit/"
Homepage = "https://github.com/dahbiz/zkit"
Issues = "https://github.com/dahbiz/zkit/issues"
Repository = "https://github.com/dahbiz/zkit.git"

[tool.setuptools.dynamic]
version = { attr = "zkit._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["zkit*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
docstring-code-format = true

